name: Security Audit

# Continuous supply-chain audit: known vulnerabilities, container CVEs, and
# licence compliance. See docs/security-compliance-distribution.md section 2.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict --desc on

      - name: Run Safety check
        # Advisory: modern Safety may require an account for the full DB.
        # pip-audit above is the authoritative gate, so this never blocks CI.
        continue-on-error: true
        run: |
          pip install safety
          safety check --full-report

  container-scan:
    name: Container Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t synedrios:audit .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'synedrios:audit'
          format: 'table'
          exit-code: '1'          # Fail the job on findings
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  licence-audit:
    name: Licence Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Check dependency licences (fail on copyleft)
        run: |
          pip install pip-licenses
          pip-licenses --fail-on "GPL;AGPL;LGPL;SSPL"
          pip-licenses --format=json --output-file=licence-report.json

      - name: Upload licence report
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: licence-report.json

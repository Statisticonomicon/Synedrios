# Pre-commit hooks for Synedrios. Install with:  pre-commit install
# Hook tool versions are pinned to match the versions the project is validated
# against; run `pre-commit autoupdate` to bump them deliberately.
# See docs/security-compliance-distribution.md section 5.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff           # linting
        args: ['--fix']
      - id: ruff-format    # formatting

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy           # type checking (src only; see pyproject.toml)
        files: ^src/
        additional_dependencies: [pydantic, sqlalchemy]
